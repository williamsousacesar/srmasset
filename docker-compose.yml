services:
  # Serviço do Banco de Dados
  db:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: srmasset
      MYSQL_USER: srmasset
      MYSQL_PASSWORD: srmasset
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rede_comunicacao
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=TCP -u root -prootpassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Serviço da Aplicação Java
  app:
    build: .
    container_name: java_container
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:mysql://db:3306/srmasset?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USER=srmasset
      - DB_PASSWORD=srmasset
    networks:
      - rede_comunicacao

  # Serviço do Frontend Angular (nginx com proxy /api -> app)
  web:
    build: ./frontend
    container_name: angular_container
    restart: on-failure
    ports:
      - "4300:80"
    depends_on:
      - app
    networks:
      - rede_comunicacao

# Volumes para não perder os dados do banco ao desligar
volumes:
  mysql_data:

# Rede que interliga os dois containers
networks:
  rede_comunicacao:
    driver: bridge